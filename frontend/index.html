<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Library Management System</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" />
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles/import.css" />
</head>
<body class="bg-light">

    <!-- SIDEBAR -->
    <div class="sidebar">
        <div class="sidebar-title">
            <i class="bi bi-book-half"></i>
            <span>Library Management System</span>
        </div>

        <nav class="sidebar-nav">
            <div class="nav-item" data-page="dashboard">
                <i class="bi bi-grid"></i>
                <span>Dashboard</span>
            </div>  

            <div class="nav-item" data-page="category">
                <i class="bi bi-tags"></i>
                <span>Category</span>
            </div>

            <div class="nav-item" data-page="publisher">
                <i class="bi bi-building"></i>
                <span>Publisher</span>
            </div>

            <div class="nav-item" data-page="author">
                <i class="bi bi-person-lines-fill"></i>
                <span>Author</span>
            </div>

            <div class="nav-item" data-page="section">
                <i class="bi bi-grid-3x3-gap"></i>
                <span>Section</span>
            </div>

            <div class="nav-item" data-page="bookprice">
                <i class="bi bi-cash"></i>
                <span>Book Price</span>
            </div>

            <div class="nav-item" data-page="policy">
                <i class="bi bi-file-earmark-ruled"></i>
                <span>Policy</span>
            </div>

            <div class="nav-item" data-page="donor">
                <i class="bi bi-gift"></i>
                <span>Donor</span>
            </div>

            <div class="nav-item" data-page="role">
                <i class="bi bi-shield-lock"></i>
                <span>Role</span>
            </div>

            <div class="nav-item" data-page="book">
                <i class="bi bi-book"></i>
                <span>Book</span>
            </div>

            <div class="nav-item" data-page="bookcopy">
                <i class="bi bi-journals"></i>
                <span>Book Copy</span>
            </div>

            <div class="nav-item" data-page="member">
                <i class="bi bi-people"></i>
                <span>Member</span>
            </div>

            <div class="nav-item" data-page="staff">
                <i class="bi bi-person-badge"></i>
                <span>Staff</span>
            </div>
        </nav>
    </div>

    <!-- MAIN CONTENT -->
    <main class="main-content">
        <div id="main-content">
            <!-- Main content will be loaded here -->
        </div>
    </main>

    <!-- Axios + Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="scripts/main.js"></script>
</body>
</html>
